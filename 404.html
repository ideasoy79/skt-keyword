<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없어요</title>
<style>
  :root{--bg:#fff;--text:#1f1f1f;--muted:#6b6b6b;--accent:#4f46e5}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif}
  main{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    justify-content:center;gap:12px;padding:32px 24px calc(32px + env(safe-area-inset-bottom))}
  h1{margin:0;font-size:24px;letter-spacing:-0.02em}
  p{margin:0;color:var(--muted);font-size:15px;line-height:1.7}
  a{display:block;margin-top:12px;padding:15px;border-radius:14px;background:var(--accent);
    color:#fff;text-align:center;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main>
  <h1>찾는 화면이 없어요</h1>
  <p>주소가 바뀌었거나 잘못 입력된 것 같아요.</p>
  <!-- GitHub Pages 프로젝트 저장소면 href 를 /저장소이름/ 으로 바꾼다 -->
  <a href="/store-lens/">처음 화면으로 가기</a>
</main>
</body>
</html>
